# ════════════════════════════════════════════════════════════════════
#  Save this file in your repo at:  .github/workflows/metrics.yml
#
#  Renders ONE combined dashboard image (metrics.svg) committed to your
#  repo — stats, languages, contribution calendar AND streaks together,
#  from a single run so the numbers can never disagree.
#
#  Refreshes every 30 minutes (near real-time). Because it's a committed
#  file, it can never be rate-limited or show broken.
#
#  Setup (already done by you): METRICS_TOKEN secret with repo + read:user.
# ════════════════════════════════════════════════════════════════════

name: Metrics

on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 minutes
  workflow_dispatch:             # manual "Run workflow" button
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate combined dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AEX0TIC
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata

          # top languages
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8

          # contribution calendar + commit streaks (same run = always in sync)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
