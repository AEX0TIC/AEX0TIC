name: Metrics

on:
  schedule:
    - cron: "17 2 * * *"      # daily, 07:47 IST — off-the-hour avoids queue pileup
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate combined dashboard
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: AEX0TIC
          filename: metrics.svg
          template: classic
          config_timezone: Asia/Kolkata
          base: header, activity, community, repositories, metadata

          retries: 3
          retries_delay: 300
          plugins_errors_fatal: no

          repositories_affiliations: owner, collaborator, organization_member
          commits_authoring: AEX0TIC, prkhprt001@gmail.com

          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
