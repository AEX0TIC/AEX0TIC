# ════════════════════════════════════════════════════════════════════
#  Save this file in your repo at:  .github/workflows/metrics.yml
#  (create the .github and .github/workflows folders if they don't exist)
#
#  It renders your GitHub stats into image FILES committed to your repo,
#  so they always load (no rate-limited servers) and refresh every 12h.
#
#  One-time setup before it works — see the checklist in the chat:
#    1. Create a classic Personal Access Token (scopes: repo, read:user)
#    2. Add it to this repo as a secret named exactly:  METRICS_TOKEN
#    3. Commit this file, then run it once from the Actions tab
# ════════════════════════════════════════════════════════════════════

name: Metrics

on:
  schedule:
    - cron: "0 */12 * * *"     # every 12 hours
  workflow_dispatch:            # lets you run it manually from the Actions tab
  push:
    branches: [main, master]    # also runs when you push

permissions:
  contents: write               # needed so the Action can commit the images

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # ── 1) Stats + top languages  →  metrics.svg ──
      - name: Stats and languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AEX0TIC
          filename: metrics.svg
          template: classic
          base: header, activity, repositories
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8

      # ── 2) Contribution calendar  →  metrics-isocalendar.svg ──
      - name: Contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AEX0TIC
          filename: metrics-isocalendar.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
